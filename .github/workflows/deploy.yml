name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # ── Data prep ────────────────────────────────────────────────────────────
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Cache the 162 MB Scryfall bulk file; refresh weekly
      - name: Get cache week key
        id: week
        run: echo "value=$(date -u +%Y-W%V)" >> "$GITHUB_OUTPUT"

      - name: Cache Scryfall bulk data
        uses: actions/cache@v6
        with:
          path: oracle-cards.json
          key: scryfall-${{ steps.week.outputs.value }}

      - name: Cache first-printing lookups
        uses: actions/cache@v6
        with:
          path: first-printing-cache.json
          key: first-printing-${{ github.run_id }}
          restore-keys: |
            first-printing-

      - name: Fetch first-printing data
        run: python fetch_first_printing.py

      # If cache missed, prepare_data.py downloads oracle-cards.json automatically
      - name: Generate game data
        run: python prepare_data.py

      # ── Build ────────────────────────────────────────────────────────────────
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build
        env:
          VITE_BASE_PATH: /castword/

      # ── Deploy ───────────────────────────────────────────────────────────────
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5
